services:
  postgres:
    image: postgres:16
    container_name: newspipe-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newspipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newspipe}
      POSTGRES_DB: ${POSTGRES_DB:-newspipe}
    ports:
      # Bind to localhost only — no externally reachable ports.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newspipe} -d ${POSTGRES_DB:-newspipe}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
