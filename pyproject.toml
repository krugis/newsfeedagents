[project]
name = "newspipe"
version = "0.1.0"
description = "Hourly GenAI/ML news ingestion pipeline (Phase 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10",
    "feedparser>=6.0",
    "httpx>=0.27",
    "langchain-deepseek>=0.3",
    "langchain-core>=0.3",
    "langchain>=0.3",
    "langgraph>=0.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newspipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: integration tests that hit real network endpoints (run with --live)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
