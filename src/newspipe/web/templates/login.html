{% extends "base.html" %}
{% block title %}Login — newspipe{% endblock %}
{% block content %}
<h1>newspipe</h1>
<form method="post" class="login-form">
  <label>Username
    <input type="text" name="username" required autofocus>
  </label>
  <label>Password
    <input type="password" name="password" required>
  </label>
  <button type="submit">Log in</button>
</form>
{% endblock %}
